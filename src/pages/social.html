<!-- {"path":"/social","title":"Social: Instagram, Facebook & YouTube","description":"The latest from Disco Sundays on Instagram, Facebook and YouTube, all in one place.","scripts":["social.js"]} -->
<section class="page-hero page-hero--compact">
  <div class="container">
    <p class="eyebrow">Social</p>
    <h1 class="display-1">What's happening at Disco Sundays.</h1>
    <p class="lead">Videos, posts and moments from across our channels. Everything links back to the original post.</p>
    {{socialLinks}}
  </div>
</section>
<section class="section section--flush-top">
  <div class="container">
    <div class="chips" role="group" aria-label="Filter by platform" data-wall-filters>
      <button type="button" class="chip is-active" data-platform="all" aria-pressed="true">All</button>
      <button type="button" class="chip" data-platform="instagram" aria-pressed="false">Instagram</button>
      <button type="button" class="chip" data-platform="facebook" aria-pressed="false">Facebook</button>
      <button type="button" class="chip" data-platform="youtube" aria-pressed="false">YouTube</button>
    </div>
    <p class="sr-only" role="status" aria-live="polite" data-wall-status></p>
    <div class="wall" data-wall>
      <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
    </div>

    <template data-tpl-instagram-fallback>
      <article class="wall__item wall__item--profile" data-platform="instagram">
        <span class="wall__badge wall__badge--instagram">Instagram</span>
        <h2 class="h3">{{instagramHandle}}</h2>
        <p>Session clips, artists and behind-the-scenes from the studio. Follow along on Instagram.</p>
        <a class="btn btn--primary btn--sm" href="{{instagramUrl}}" target="_blank" rel="noopener" data-track="social_profile_click" data-label="instagram">View on Instagram</a>
      </article>
    </template>
    <template data-tpl-facebook>
      <article class="wall__item wall__item--facebook" data-platform="facebook">
        <span class="wall__badge wall__badge--facebook">Facebook</span>
        <h2 class="h3">discosundaysofficial</h2>
        <div class="fb-embed" data-fb-embed>
          <p>Load our Facebook Page timeline here. Facebook may set cookies when it loads.</p>
          <div class="btn-row">
            <button type="button" class="btn btn--primary btn--sm" data-fb-load data-src="{{facebookPluginSrc}}">Load recent Facebook posts</button>
            <a class="btn btn--ghost btn--sm" href="{{facebookUrl}}" target="_blank" rel="noopener" data-track="social_profile_click" data-label="facebook">Open Facebook</a>
          </div>
        </div>
      </article>
    </template>
  </div>
</section>
{{ctaBand}}
