<section class="page-hero page-hero--compact">
  <div class="container">
    <p class="eyebrow">Gallery</p>
    <h1 class="display-1">The visual archive.</h1>
    <p class="lead">Sessions, performances, reels and behind-the-scenes from across our channels. Tap anything to watch it here or open the original.</p>
    {{followButtons}}
  </div>
</section>
<section class="section section--flush-top">
  <div class="container">
    <div class="gallery-bar">
      <div class="chips" role="group" aria-label="Filter by platform" data-wall-filters>
        <button type="button" class="chip is-active" data-platform="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-platform="instagram" aria-pressed="false">Instagram</button>
        <button type="button" class="chip" data-platform="facebook" aria-pressed="false">Facebook</button>
        <button type="button" class="chip" data-platform="youtube" aria-pressed="false">YouTube</button>
      </div>
      <p class="gallery-bar__status" role="status" aria-live="polite" data-wall-status></p>
    </div>
    <div class="wall" data-wall>
      <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
    </div>
  </div>
</section>
