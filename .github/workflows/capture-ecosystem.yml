name: Capture ecosystem screenshots

# Re-run from the Actions tab ("Run workflow") whenever the App, Rewards or RAP Program change.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/capture-ecosystem.mjs
      - .github/workflows/capture-ecosystem.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and sharp (not saved to package.json)
        run: |
          npm i --no-save playwright@1 sharp@0
          npx playwright install --with-deps chromium
      - name: Capture
        run: node scripts/capture-ecosystem.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ecosystem media-originals/ecosystem content/ecosystem-shots.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update App, Rewards and RAP Program screenshots"
          git push
